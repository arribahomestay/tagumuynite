<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TAGUM UYNITE - Admin Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <link rel="stylesheet" href="../assets/css/login.css" />
 </head>
 <body data-theme="dark" class="min-h-screen text-slate-100 flex items-center justify-center px-4 bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950 login-mobile-pad">
  <button type="button" class="login-theme-toggle" aria-label="Toggle theme">
    <span class="login-theme-icon"></span>
  </button>
  <div class="login-shell max-w-md w-full bg-slate-900/90 border border-slate-800/70 rounded-3xl shadow-2xl px-7 py-8 sm:px-9 sm:py-9">
    <div class="mb-6 flex items-center justify-center">
      <img id="login-logo" src="../assets/images/TAGUM_DARK.png" alt="TAGUM UYNITE logo" class="w-28 h-28 sm:w-32 sm:h-32 object-contain login-logo-img" />
    </div>

    <form action="dashboard.html" method="GET" class="space-y-4 login-form">
      <div class="flex flex-col gap-1">
        <label for="email" class="text-sm font-medium text-slate-200">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="admin@example.com"
          required
          class="rounded-lg border border-slate-700 bg-slate-900/70 px-3 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent login-input"
        />
      </div>

      <div class="flex flex-col gap-1">
        <label for="password" class="text-sm font-medium text-slate-200">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="••••••••"
          required
          class="rounded-lg border border-slate-700 bg-slate-900/70 px-3 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent login-input"
        />
      </div>

      <div class="flex items-center justify-between text-[11px] text-slate-400">
        <label class="inline-flex items-center gap-2 cursor-pointer">
          <input type="checkbox" class="h-3.5 w-3.5 rounded border-slate-600 bg-slate-900" />
          <span>Remember me</span>
        </label>
        <a href="#" class="text-sky-400 hover:text-sky-300 transition-colors">Forgot password?</a>
      </div>

      <button
        type="submit"
        class="w-full inline-flex items-center justify-center rounded-lg bg-sky-500 px-4 py-2.5 text-sm font-medium text-slate-900 hover:bg-sky-400 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:ring-offset-2 focus:ring-offset-slate-950 transition-colors login-button"
      >
        SIGN IN
      </button>
    </form>

    <p class="mt-6 text-[11px] text-slate-500 text-center">
      &copy; 2025 TAGUM UYNITE. All rights reserved.
    </p>
  </div>
  <script src="../assets/js/login.js"></script>
</body>
</html>
