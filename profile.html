<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TAGUM UYNITE - Profile Settings</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="app-body" data-theme="dark">
  <div class="app-layout">
    <main class="app-main">
      <header class="app-header">
        <div>
          <h1>Profile & Security</h1>
          <p class="muted">Manage your account details and password.</p>
        </div>
        <div class="header-actions">
          <a href="dashboard.html" class="btn-outline">Back to dashboard</a>
        </div>
      </header>

      <section class="grid grid-2">
        <div class="card">
          <div class="card-header">
            <h2>Account information</h2>
          </div>
          <form class="auth-form">
            <div class="field-group">
              <label>Full name</label>
              <input type="text" value="TAGUM UYNITE Admin" />
            </div>
            <div class="field-group">
              <label>Email</label>
              <input type="email" value="admin@tagumuynite.com" />
            </div>
            <div class="field-group">
              <label>Phone (optional)</label>
              <input type="tel" placeholder="+63" />
            </div>
            <button type="button" class="btn btn-primary">Save changes</button>
          </form>
        </div>

        <div class="card">
          <div class="card-header">
            <h2>Security</h2>
          </div>
          <form class="auth-form">
            <div class="field-group">
              <label>Current password</label>
              <input type="password" placeholder="Current password" />
            </div>
            <div class="field-group">
              <label>New password</label>
              <input type="password" placeholder="New password" />
            </div>
            <div class="field-group">
              <label>Confirm new password</label>
              <input type="password" placeholder="Confirm new password" />
            </div>
            <button type="button" class="btn btn-primary">Update password</button>
          </form>
        </div>
      </section>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
